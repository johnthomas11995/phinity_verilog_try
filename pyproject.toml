[project]
name = "example-verilog-repo-retry"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cocotb>=1.8.0",
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
